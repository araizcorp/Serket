<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Serket — Attack Paths</title>
  <link rel="icon" href="/assets/assets/brand/favicon.ico" sizes="any">
  <style>
    :root {
      --bg0: #05070b; --bg1: #0a0f18; --panel: #0c1220; --panel2: #111a2c;
      --line: #1f2a40; --line2: #2c3a58;
      --txt: #e8eef8; --dim: #8b98b4; --faint: #5b6884;
      --accent: #2ee6a8; --origin: #38bdf8; --target: #fb7185; --hv: #f2b544;
      --user: #38bdf8; --group: #f2b544; --computer: #a78bfa; --dc: #fb923c;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; color: var(--txt);
      font: 13.5px/1.5 "Segoe UI", system-ui, -apple-system, sans-serif;
      overflow: hidden;
      background:
        radial-gradient(1200px 700px at 70% -10%, #101a30 0%, transparent 60%),
        radial-gradient(900px 600px at 0% 110%, #0d1526 0%, transparent 55%),
        var(--bg0);
    }
    button { font: inherit; cursor: pointer; }

    /* ── top bar ─────────────────────────────────────────── */
    .top {
      height: 54px; display: flex; align-items: center; gap: 16px;
      padding: 0 16px;
      background: linear-gradient(180deg, rgba(17,26,44,.9), rgba(12,18,32,.9));
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(6px);
    }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; letter-spacing: .16em; font-size: 14px; }
    .brand img { width: 30px; height: 30px; filter: drop-shadow(0 0 6px rgba(46,230,168,.35)); }
    .brand small { color: var(--dim); font-weight: 500; letter-spacing: .02em; }
    .domain { color: var(--dim); font-size: 12px; white-space: nowrap; }
    .domain b { color: var(--txt); font-weight: 600; }
    .search { position: relative; flex: 0 1 360px; margin-left: auto; }
    .search input {
      width: 100%; background: rgba(5,8,14,.7); border: 1px solid var(--line2);
      border-radius: 9px; color: var(--txt); padding: 8px 12px; outline: none;
      font-size: 12.5px; transition: border-color .15s, box-shadow .15s;
    }
    .search input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(46,230,168,.12); }
    .search .drop {
      position: absolute; top: 40px; left: 0; right: 0; background: var(--panel2);
      border: 1px solid var(--line2); border-radius: 10px; max-height: 320px;
      overflow: auto; display: none; z-index: 50; box-shadow: 0 16px 40px rgba(0,0,0,.5);
    }
    .search .drop div { padding: 8px 12px; cursor: pointer; display: flex; justify-content: space-between; gap: 10px; border-radius: 6px; margin: 2px; }
    .search .drop div:hover { background: #182441; }
    .search .drop .t { color: var(--dim); font-size: 11px; }
    .pill {
      background: rgba(46,230,168,.1); border: 1px solid rgba(46,230,168,.35);
      color: var(--accent); font-size: 10.5px; font-weight: 700; letter-spacing: .1em;
      border-radius: 999px; padding: 4px 10px; white-space: nowrap;
    }
    .lang {
      background: transparent; border: 1px solid var(--line2); color: var(--dim);
      border-radius: 8px; padding: 5px 9px; font-size: 11.5px; font-weight: 700;
    }
    .lang:hover { color: var(--txt); border-color: var(--dim); }
    .link { color: var(--faint); font-size: 11.5px; text-decoration: none; }
    .link:hover { color: var(--txt); }

    /* ── layout ──────────────────────────────────────────── */
    .main { display: flex; height: calc(100% - 54px); }
    .stage { flex: 1; position: relative; overflow: hidden; }
    .scope {
      position: absolute; top: 12px; left: 14px; display: flex; gap: 6px; z-index: 20;
    }
    .scope button {
      background: rgba(10,15,26,.88); border: 1px solid var(--line2); color: var(--dim);
      border-radius: 8px; padding: 5px 12px; font-size: 11.5px; font-weight: 700;
      backdrop-filter: blur(4px);
    }
    .scope button:hover { color: var(--txt); }
    .scope button.on { color: var(--accent); border-color: rgba(46,230,168,.5); }
    .edge-lbl { paint-order: stroke; stroke: rgba(5,7,11,.9); stroke-width: 3px; pointer-events: none; }
    #graph { width: 100%; height: 100%; display: block; cursor: grab; }
    #graph.panning { cursor: grabbing; }

    .side {
      width: 308px; flex: none;
      background: linear-gradient(180deg, rgba(12,18,32,.95), rgba(9,13,24,.95));
      border-left: 1px solid var(--line);
      display: flex; flex-direction: column; overflow-y: auto; padding: 14px; gap: 18px;
    }
    .side section {
      background: rgba(17,26,44,.45); border: 1px solid var(--line);
      border-radius: 12px; padding: 12px;
    }
    .side h2 {
      margin: 0 0 9px; font-size: 10px; letter-spacing: .16em; text-transform: uppercase;
      color: var(--dim); display: flex; justify-content: space-between; align-items: center;
      font-weight: 700;
    }
    .side h2 .count { color: var(--accent); }

    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip {
      display: inline-flex; align-items: center; gap: 6px; max-width: 100%;
      background: rgba(46,230,168,.08); border: 1px solid rgba(46,230,168,.3);
      color: #c8f5e4; border-radius: 999px; padding: 4px 5px 4px 10px; font-size: 11.5px;
      transition: border-color .15s;
    }
    .chip:hover { border-color: var(--accent); }
    .chip i { font-style: normal; max-width: 165px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
    .chip b { color: #6fae97; cursor: pointer; padding: 0 5px; font-weight: 400; border-radius: 999px; }
    .chip b:hover { color: #ff9d9d; }
    .empty { color: var(--faint); font-size: 11.5px; font-style: italic; }

    .marks { display: flex; flex-direction: column; gap: 6px; font-size: 12.5px; margin-bottom: 11px; }
    .marks span { color: var(--dim); display: flex; gap: 7px; align-items: center; }
    .marks b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 190px; display: inline-block; vertical-align: bottom; }
    .marks .o { color: var(--origin); } .marks .t2 { color: var(--target); }

    .big {
      width: 100%; background: linear-gradient(180deg, #37f0b6, #1fd39a); color: #03281c;
      border: 0; font-weight: 800; border-radius: 9px; padding: 10px; font-size: 13px;
      box-shadow: 0 4px 16px rgba(46,230,168,.25); transition: filter .15s, transform .05s;
    }
    .big:not(:disabled):hover { filter: brightness(1.07); }
    .big:not(:disabled):active { transform: translateY(1px); }
    .big:disabled { opacity: .35; cursor: not-allowed; box-shadow: none; }
    .mini {
      width: 100%; background: transparent; color: var(--dim); border: 1px solid var(--line2);
      border-radius: 8px; padding: 7px; font-size: 11.5px; margin-top: 8px; transition: color .15s, border-color .15s;
    }
    .mini:hover { color: var(--txt); border-color: var(--dim); }

    .results { display: flex; flex-direction: column; gap: 7px; }
    .result {
      text-align: left; background: rgba(5,8,14,.55); border: 1px solid var(--line2);
      border-radius: 9px; padding: 9px 11px; color: var(--txt); width: 100%;
      transition: border-color .15s, background .15s;
    }
    .result:hover { border-color: var(--dim); }
    .result.active { border-color: var(--accent); background: rgba(46,230,168,.06); }
    .result .r1 { display: flex; justify-content: space-between; gap: 8px; font-weight: 600; font-size: 12px; }
    .result .r2 { color: var(--dim); font-size: 11px; margin-top: 3px; }
    .n { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; }
    .n.low { background: var(--accent); } .n.med { background: var(--hv); } .n.high { background: var(--target); }

    /* ── graph ───────────────────────────────────────────── */
    .legend {
      position: absolute; left: 14px; bottom: 14px; display: flex; gap: 14px;
      background: rgba(10,15,26,.88); border: 1px solid var(--line);
      border-radius: 10px; padding: 7px 12px; font-size: 11px; color: var(--dim);
      backdrop-filter: blur(4px);
    }
    .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; }

    .gnode { cursor: pointer; }
    .gnode .halo { fill: none; stroke: transparent; }
    .gnode .body {
      fill: #0d1524; stroke-width: 2.4;
      filter: drop-shadow(0 3px 6px rgba(0,0,0,.55));
      transition: stroke-width .12s;
    }
    .gnode:hover .body { stroke-width: 3.4; }
    .gnode .sym { font-size: 12.5px; font-weight: 800; pointer-events: none; }
    .gnode .lbl {
      font-size: 11px; font-weight: 600; fill: #dbe4f3; text-anchor: middle;
      paint-order: stroke; stroke: rgba(5,7,11,.92); stroke-width: 3.5px;
      pointer-events: none; letter-spacing: .01em;
    }
    .gnode.owned .body { stroke: var(--accent) !important; }
    .gnode.owned .halo { stroke: rgba(46,230,168,.5); stroke-width: 2; }
    .gnode.origin .halo { stroke: var(--origin); stroke-width: 2; stroke-dasharray: 5 4; }
    .gnode.target .halo { stroke: var(--target); stroke-width: 2; stroke-dasharray: 5 4; }
    .gnode .own { fill: var(--accent); stroke: #05070b; stroke-width: 1.6; }

    /* ── path strip ──────────────────────────────────────── */
    .strip {
      position: absolute; left: 0; right: 0; bottom: 0; max-height: 47%;
      background: linear-gradient(180deg, rgba(12,18,32,.97), rgba(8,12,22,.97));
      border-top: 1px solid var(--line2);
      display: none; flex-direction: column; padding: 10px 14px 12px;
      box-shadow: 0 -12px 40px rgba(0,0,0,.45);
    }
    .strip.open { display: flex; }
    .strip .shead { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
    .strip .shead strong { font-size: 13px; }
    .strip .shead .meta { color: var(--dim); font-size: 11.5px; }
    .strip .shead button {
      background: var(--panel2); border: 1px solid var(--line2); color: var(--txt);
      border-radius: 7px; padding: 4px 11px; font-size: 12.5px;
    }
    .strip .shead button:hover { border-color: var(--dim); }
    .strip .shead .x { margin-left: auto; background: transparent; border: 0; color: var(--dim); font-size: 17px; padding: 2px 8px; }
    .strip .shead .x:hover { color: var(--txt); }
    .strip .scroll { overflow-x: auto; overflow-y: hidden; }
    .strip svg { display: block; }
    .stepdetail { color: var(--dim); font-size: 12px; min-height: 17px; margin-top: 4px; }
    .stepdetail b { color: var(--txt); }
    .snode circle.body2 { filter: drop-shadow(0 3px 6px rgba(0,0,0,.5)); }
    .snode text { paint-order: stroke; stroke: rgba(5,7,11,.9); stroke-width: 3px; }

    /* ── context menu ────────────────────────────────────── */
    .menu {
      position: fixed; z-index: 100; min-width: 220px; display: none;
      background: rgba(17,26,44,.98); border: 1px solid var(--line2); border-radius: 11px;
      box-shadow: 0 18px 50px rgba(0,0,0,.6); padding: 6px;
      backdrop-filter: blur(8px);
    }
    .menu.open { display: block; }
    .menu .mh { padding: 8px 11px 6px; border-bottom: 1px solid var(--line); margin-bottom: 5px; }
    .menu .mh b { display: block; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 270px; }
    .menu .mh span { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); }
    .menu button {
      display: flex; gap: 9px; width: 100%; text-align: left; background: transparent;
      border: 0; color: var(--txt); padding: 8px 11px; border-radius: 7px; font-size: 12.5px;
    }
    .menu button:hover { background: #1c2a49; }

    .toast {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: rgba(17,26,44,.97); border: 1px solid var(--line2); color: var(--txt);
      border-radius: 10px; padding: 9px 18px; font-size: 12.5px; display: none; z-index: 200;
      box-shadow: 0 10px 30px rgba(0,0,0,.5);
    }

    /* ── legal modal ─────────────────────────────────────── */
    .modal {
      position: fixed; inset: 0; background: rgba(3,5,9,.92); display: flex;
      align-items: center; justify-content: center; z-index: 500;
      backdrop-filter: blur(3px);
    }
    .modal[hidden] { display: none; }
    .modal .box {
      width: 470px; background: linear-gradient(180deg, #101a2e, #0b1220);
      border: 1px solid var(--line2); border-radius: 16px; padding: 28px; text-align: center;
      box-shadow: 0 30px 80px rgba(0,0,0,.6);
    }
    .modal h1 { font-size: 19px; margin: 12px 0 7px; }
    .modal p { color: var(--dim); font-size: 13px; margin: 0 0 18px; line-height: 1.55; }
    .modal label { display: flex; gap: 10px; text-align: left; font-size: 12.5px; color: var(--txt); margin-bottom: 16px; line-height: 1.45; }
    .modal .go {
      width: 100%; background: linear-gradient(180deg, #37f0b6, #1fd39a); border: 0;
      color: #03281c; font-weight: 800; border-radius: 9px; padding: 11px; font-size: 13.5px;
    }
    .modal .go:disabled { opacity: .35; cursor: not-allowed; }
  </style>
</head>
<body>

  <div class="modal" id="legal">
    <div class="box">
      <img src="/assets/assets/brand/serket-logo-primary-red-v3.png" alt="Serket" style="max-width:190px">
      <h1 data-i18n="legal_title">Uso profesional autorizado</h1>
      <p data-i18n="legal_text">Serket analiza rutas de ataque de Active Directory. Solo puedes ejecutarlo contra sistemas propios o con autorización escrita y alcance definido.</p>
      <label><input type="checkbox" id="legal-ok"> <span data-i18n="legal_check">Confirmo que dispongo de autorización escrita y asumo la responsabilidad de su uso.</span></label>
      <button class="go" id="legal-go" disabled data-i18n="legal_go">Entrar</button>
    </div>
  </div>

  <header class="top">
    <div class="brand"><img src="/assets/assets/brand/serket-icon-512.png" alt=""><span>SERKET <small data-i18n="tagline">rutas de ataque</small></span></div>
    <div class="domain" id="domain">…</div>
    <div class="search">
      <input id="q" type="search" autocomplete="off" data-i18n-ph="search_ph" placeholder="Buscar usuario, grupo, equipo…  ( / )">
      <div class="drop" id="qdrop"></div>
    </div>
    <span class="pill">LOCAL</span>
    <button class="lang" id="lang" type="button" title="Language / Idioma">EN</button>
    <a class="link" href="/classic" target="_blank" rel="noopener" data-i18n="classic">vista clásica</a>
  </header>

  <div class="main">
    <div class="stage">
      <div class="scope">
        <button id="m-neigh" type="button" data-i18n="explore">Explorar</button>
        <button id="m-path" type="button" data-i18n="route" style="display:none">Ruta</button>
        <button id="d-toggle" type="button">+1 salto</button>
      </div>
      <svg id="graph" viewBox="0 0 1280 800" preserveAspectRatio="xMidYMid meet">
        <defs>
          <marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="#54648c"></path></marker>
        </defs>
        <g id="vp"></g>
      </svg>
      <div class="legend" id="legend"></div>
      <div class="strip" id="strip">
        <div class="shead">
          <button id="sprev" type="button">←</button>
          <button id="snext" type="button">→</button>
          <strong id="stitle"></strong>
          <span class="meta" id="smeta"></span>
          <button class="x" id="sclose" type="button">×</button>
        </div>
        <div class="scroll"><svg id="spath" height="175"></svg></div>
        <div class="stepdetail" id="sdetail"></div>
      </div>
    </div>

    <aside class="side">
      <section>
        <h2><span data-i18n="my_accounts">Mis cuentas</span> <span class="count" id="owned-count"></span></h2>
        <div class="chips" id="chips"></div>
        <button class="mini" id="clear-owned" type="button" data-i18n="clear">Limpiar marcas</button>
      </section>
      <section>
        <h2 data-i18n="search">Búsqueda</h2>
        <div class="marks">
          <span>🎯 <span data-i18n="origin">Origen</span>: <b class="o" id="m-origin"></b></span>
          <span>🏁 <span data-i18n="target">Objetivo</span>: <b class="t2" id="m-target"></b></span>
        </div>
        <button class="big" id="search" type="button" data-i18n="find_paths">Buscar rutas</button>
      </section>
      <section>
        <h2><span data-i18n="paths">Rutas</span> <span class="count" id="res-count"></span></h2>
        <div class="results" id="results"></div>
      </section>
    </aside>
  </div>

  <div class="menu" id="menu"></div>
  <div class="toast" id="toast"></div>

  <script src="/assets/simple.js"></script>
</body>
</html>
