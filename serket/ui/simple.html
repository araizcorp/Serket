<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Serket — Attack Paths</title>
  <link rel="icon" href="/assets/assets/brand/favicon.ico" sizes="any">
  <style>
    :root {
      --bg0: #05080e; --bg1: #090e17; --panel: #0b111c; --panel2: #0f1726;
      --line: #172136; --line2: #223150;
      --txt: #e8eef9; --dim: #94a2bf; --faint: #5d6b88;
      --accent: #2fd9a1; --accent-dim: rgba(47,217,161,.12);
      --origin: #4cc3ff; --target: #ff7a90; --hv: #f5c451;
      --user: #4cc3ff; --group: #f5c451; --computer: #b79df7; --dc: #ffab63;
      --edge: #3f4c6b; --edge-in: #56637f;
      --font: "Inter","Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
      --mono: "Cascadia Code","JetBrains Mono",Consolas,"SF Mono",monospace;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; color: var(--txt); font: 13px/1.55 var(--font);
      overflow: hidden; letter-spacing: .005em;
      background:
        radial-gradient(1100px 620px at 72% -12%, rgba(38,58,96,.28) 0%, transparent 60%),
        radial-gradient(800px 540px at -8% 112%, rgba(28,44,76,.22) 0%, transparent 55%),
        var(--bg0);
    }
    button { font: inherit; cursor: pointer; }
    ::selection { background: rgba(47,217,161,.25); }

    /* ── top bar ─────────────────────────────────────────── */
    .top {
      height: 50px; display: flex; align-items: center; gap: 14px;
      padding: 0 14px;
      background: rgba(9,14,23,.82);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(10px);
    }
    .brand { display: flex; align-items: center; gap: 9px; font-weight: 700; letter-spacing: .24em; font-size: 12.5px; }
    .brand img { width: 24px; height: 24px; filter: drop-shadow(0 0 8px rgba(47,217,161,.4)); }
    .brand small { color: var(--dim); font-weight: 450; letter-spacing: .03em; text-transform: lowercase; }
    .domain { color: var(--dim); font-size: 11.5px; white-space: nowrap; font-family: var(--mono); }
    .domain b { color: var(--txt); font-weight: 600; }
    .search { position: relative; flex: 0 1 340px; margin-left: auto; }
    .search input {
      width: 100%; background: rgba(5,8,14,.72); border: 1px solid var(--line2);
      border-radius: 8px; color: var(--txt); padding: 7px 12px; outline: none;
      font-size: 12.5px; font-family: var(--mono); transition: border-color .15s, box-shadow .15s;
    }
    .search input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-dim); }
    .search input::placeholder { font-family: var(--font); color: var(--faint); }
    .search .drop {
      position: absolute; top: 38px; left: 0; right: 0; background: rgba(15,23,38,.97);
      border: 1px solid var(--line2); border-radius: 10px; max-height: 320px;
      overflow: auto; display: none; z-index: 50; box-shadow: 0 18px 44px rgba(0,0,0,.55);
    }
    .search .drop div { padding: 7px 12px; cursor: pointer; display: flex; justify-content: space-between; gap: 10px; border-radius: 6px; margin: 2px; }
    .search .drop div:hover { background: rgba(76,195,255,.08); }
    .search .drop .t { color: var(--faint); font-size: 10.5px; font-family: var(--font); }
    .pill {
      background: var(--accent-dim); border: 1px solid rgba(47,217,161,.32);
      color: var(--accent); font-size: 10px; font-weight: 700; letter-spacing: .14em;
      border-radius: 999px; padding: 3px 10px; white-space: nowrap;
    }
    .lang {
      background: transparent; border: 1px solid var(--line2); color: var(--dim);
      border-radius: 7px; padding: 4px 9px; font-size: 11px; font-weight: 700;
      transition: color .15s, border-color .15s;
    }
    .lang:hover { color: var(--txt); border-color: var(--dim); }
    .link { color: var(--faint); font-size: 11px; text-decoration: none; transition: color .15s; }
    .link:hover { color: var(--txt); }

    /* ── layout ──────────────────────────────────────────── */
    .main { display: flex; height: calc(100% - 50px); }
    .stage { flex: 1; position: relative; overflow: hidden; }
    .scope { position: absolute; top: 12px; left: 14px; display: flex; gap: 6px; z-index: 20; }
    .scope button {
      background: rgba(9,14,23,.9); border: 1px solid var(--line2); color: var(--dim);
      border-radius: 7px; padding: 5px 13px; font-size: 11px; font-weight: 700;
      letter-spacing: .04em; backdrop-filter: blur(6px); transition: color .15s, border-color .15s;
    }
    .scope button:hover { color: var(--txt); }
    .scope button.on { color: var(--accent); border-color: rgba(47,217,161,.55); background: var(--accent-dim); }
    #graph { width: 100%; height: 100%; display: block; cursor: grab; }
    #graph.panning { cursor: grabbing; }

    .side {
      width: 296px; flex: none;
      background: rgba(9,14,23,.92);
      border-left: 1px solid var(--line);
      display: flex; flex-direction: column; overflow-y: auto; padding: 12px; gap: 12px;
    }
    .side::-webkit-scrollbar { width: 8px; }
    .side::-webkit-scrollbar-thumb { background: var(--line2); border-radius: 8px; }
    .side section {
      background: rgba(15,23,38,.42); border: 1px solid var(--line);
      border-radius: 10px; padding: 12px;
    }
    .side h2 {
      margin: 0 0 10px; font-size: 9.5px; letter-spacing: .2em; text-transform: uppercase;
      color: var(--faint); display: flex; justify-content: space-between; align-items: center;
      font-weight: 700;
    }
    .side h2 .count { color: var(--accent); letter-spacing: 0; font-size: 11px; }

    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip {
      display: inline-flex; align-items: center; gap: 6px; max-width: 100%;
      background: var(--accent-dim); border: 1px solid rgba(47,217,161,.28);
      color: #c9f3e2; border-radius: 6px; padding: 3px 4px 3px 9px; font-size: 11px;
      font-family: var(--mono); transition: border-color .15s;
    }
    .chip:hover { border-color: var(--accent); }
    .chip i { font-style: normal; max-width: 165px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
    .chip b { color: #69a892; cursor: pointer; padding: 0 5px; font-weight: 400; border-radius: 4px; }
    .chip b:hover { color: #ff9d9d; }
    .empty { color: var(--faint); font-size: 11px; font-style: italic; }

    .marks { display: flex; flex-direction: column; gap: 6px; font-size: 12px; margin-bottom: 11px; }
    .marks span { color: var(--dim); display: flex; gap: 7px; align-items: center; }
    .marks b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 180px; display: inline-block; vertical-align: bottom; font-family: var(--mono); font-size: 11px; }
    .marks .o { color: var(--origin); } .marks .t2 { color: var(--target); }

    .big {
      width: 100%; background: var(--accent); color: #04241a;
      border: 0; font-weight: 700; border-radius: 8px; padding: 9px; font-size: 12.5px;
      letter-spacing: .02em; box-shadow: 0 4px 14px rgba(47,217,161,.22);
      transition: filter .15s, transform .05s;
    }
    .big:not(:disabled):hover { filter: brightness(1.08); }
    .big:not(:disabled):active { transform: translateY(1px); }
    .big:disabled { opacity: .35; cursor: not-allowed; box-shadow: none; }
    .mini {
      width: 100%; background: transparent; color: var(--dim); border: 1px solid var(--line2);
      border-radius: 7px; padding: 6px; font-size: 11px; margin-top: 8px; transition: color .15s, border-color .15s;
    }
    .mini:hover { color: var(--txt); border-color: var(--dim); }

    .results { display: flex; flex-direction: column; gap: 6px; }
    .result {
      text-align: left; background: rgba(5,8,14,.5); border: 1px solid var(--line2);
      border-radius: 8px; padding: 8px 11px; color: var(--txt); width: 100%;
      transition: border-color .15s, background .15s;
    }
    .result:hover { border-color: var(--dim); }
    .result.active { border-color: var(--accent); background: var(--accent-dim); }
    .result .r1 { display: flex; justify-content: space-between; gap: 8px; font-weight: 600; font-size: 11.5px; font-family: var(--mono); }
    .result .r2 { color: var(--dim); font-size: 10.5px; margin-top: 3px; }
    .n { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 5px; }
    .n.low { background: var(--accent); } .n.med { background: var(--hv); } .n.high { background: var(--target); }

    /* ── graph ───────────────────────────────────────────── */
    .legend {
      position: absolute; left: 14px; bottom: 14px; display: flex; gap: 13px;
      background: rgba(9,14,23,.88); border: 1px solid var(--line);
      border-radius: 8px; padding: 6px 12px; font-size: 10.5px; color: var(--dim);
      backdrop-filter: blur(8px);
    }
    .legend i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; }
    .legend i.li-line { width: 15px; height: 0; border-radius: 0; border-top: 2px solid var(--edge); vertical-align: middle; }
    .legend i.li-line.dash { border-top-style: dashed; border-top-color: var(--edge-in); }

    .gnode { cursor: pointer; }
    .gnode .halo { fill: none; stroke: transparent; }
    .gnode .glow { fill: none; stroke-opacity: 0; stroke-width: 6; transition: stroke-opacity .15s; pointer-events: none; }
    .gnode:hover .glow { stroke-opacity: .3; }
    .gnode .body {
      fill: #0d1524; stroke-width: 1.8;
      filter: drop-shadow(0 4px 10px rgba(0,0,0,.5));
      transition: stroke-width .12s;
    }
    .gnode.t-user .body { fill: rgba(76,195,255,.13); }
    .gnode.t-group .body { fill: rgba(245,196,81,.12); }
    .gnode.t-computer .body { fill: rgba(183,157,247,.12); }
    .gnode.t-dc .body { fill: rgba(255,171,99,.13); }
    .gnode.t-cert .body { fill: rgba(94,234,212,.11); }
    .gnode.t-obj .body { fill: rgba(148,163,184,.1); }
    .gnode:hover .body { stroke-width: 2.6; }
    .gnode .sym { pointer-events: none; opacity: .92; }
    .gnode .lbl {
      font-size: 11px; font-weight: 600; fill: #d5deee; text-anchor: middle;
      paint-order: stroke; stroke: rgba(5,8,14,.95); stroke-width: 4px; stroke-linejoin: round;
      pointer-events: none; letter-spacing: .015em;
    }
    .gnode.owned .body { stroke: var(--accent) !important; }
    .gnode.owned .halo { stroke: rgba(47,217,161,.45); stroke-width: 2; }
    .gnode.origin .halo { stroke: var(--origin); stroke-width: 2; stroke-dasharray: 5 4; }
    .gnode.target .halo { stroke: var(--target); stroke-width: 2; stroke-dasharray: 5 4; }
    .gnode .own { fill: var(--accent); stroke: #05080e; stroke-width: 1.6; }
    .edge-lbl { font-family: var(--font); }

    /* ── path strip ──────────────────────────────────────── */
    .strip {
      position: absolute; left: 0; right: 0; bottom: 0; max-height: 47%;
      background: rgba(9,14,23,.97);
      border-top: 1px solid var(--line2);
      display: none; flex-direction: column; padding: 10px 14px 12px;
      box-shadow: 0 -14px 44px rgba(0,0,0,.5);
    }
    .strip.open { display: flex; }
    .strip .shead { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
    .strip .shead strong { font-size: 12.5px; font-family: var(--mono); font-weight: 600; }
    .strip .shead .meta { color: var(--dim); font-size: 11px; }
    .strip .shead button {
      background: var(--panel2); border: 1px solid var(--line2); color: var(--txt);
      border-radius: 6px; padding: 3px 11px; font-size: 12px;
    }
    .strip .shead button:hover { border-color: var(--dim); }
    .strip .shead .x { margin-left: auto; background: transparent; border: 0; color: var(--dim); font-size: 17px; padding: 2px 8px; }
    .strip .shead .x:hover { color: var(--txt); }
    .strip .scroll { overflow-x: auto; overflow-y: hidden; }
    .strip svg { display: block; }
    .stepdetail { color: var(--dim); font-size: 11.5px; min-height: 17px; margin-top: 4px; font-family: var(--mono); }
    .stepdetail b { color: var(--txt); }
    .snode circle.body2 { filter: drop-shadow(0 4px 10px rgba(0,0,0,.5)); }
    .snode.t-user .body2 { fill: rgba(76,195,255,.13); }
    .snode.t-group .body2 { fill: rgba(245,196,81,.12); }
    .snode.t-computer .body2 { fill: rgba(183,157,247,.12); }
    .snode.t-dc .body2 { fill: rgba(255,171,99,.13); }
    .snode.t-cert .body2 { fill: rgba(94,234,212,.11); }
    .snode.t-obj .body2 { fill: rgba(148,163,184,.1); }
    .snode text { paint-order: stroke; stroke: rgba(5,8,14,.92); stroke-width: 3.5px; stroke-linejoin: round; }

    /* ── context menu ────────────────────────────────────── */
    .menu {
      position: fixed; z-index: 100; min-width: 230px; display: none;
      background: rgba(13,20,33,.98); border: 1px solid var(--line2); border-radius: 10px;
      box-shadow: 0 20px 54px rgba(0,0,0,.6); padding: 5px;
      backdrop-filter: blur(10px);
    }
    .menu.open { display: block; }
    .menu .mh { padding: 8px 11px 7px; border-bottom: 1px solid var(--line); margin-bottom: 4px; }
    .menu .mh b { display: block; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 280px; font-family: var(--mono); font-weight: 600; }
    .menu .mh span { font-size: 9.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--faint); }
    .menu button {
      display: flex; gap: 9px; width: 100%; text-align: left; background: transparent;
      border: 0; color: var(--txt); padding: 8px 11px; border-radius: 6px; font-size: 12px;
    }
    .menu button:hover { background: rgba(76,195,255,.09); }

    .toast {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: rgba(13,20,33,.97); border: 1px solid var(--line2); color: var(--txt);
      border-radius: 9px; padding: 9px 18px; font-size: 12px; display: none; z-index: 200;
      box-shadow: 0 12px 32px rgba(0,0,0,.55); font-family: var(--mono);
    }

    /* ── legal modal ─────────────────────────────────────── */
    .modal {
      position: fixed; inset: 0; background: rgba(3,5,9,.9); display: flex;
      align-items: center; justify-content: center; z-index: 500;
      backdrop-filter: blur(4px);
    }
    .modal[hidden] { display: none; }
    .modal .box {
      width: 460px; background: linear-gradient(180deg, #101a2c, #0a101b);
      border: 1px solid var(--line2); border-radius: 14px; padding: 28px; text-align: center;
      box-shadow: 0 32px 84px rgba(0,0,0,.65);
    }
    .modal h1 { font-size: 18px; margin: 12px 0 7px; font-weight: 700; }
    .modal p { color: var(--dim); font-size: 12.5px; margin: 0 0 18px; line-height: 1.6; }
    .modal label { display: flex; gap: 10px; text-align: left; font-size: 12px; color: var(--txt); margin-bottom: 16px; line-height: 1.5; }
    .modal .go {
      width: 100%; background: var(--accent); border: 0;
      color: #04241a; font-weight: 700; border-radius: 8px; padding: 11px; font-size: 13px;
    }
    .modal .go:disabled { opacity: .35; cursor: not-allowed; }
  </style>
</head>
<body>

  <div class="modal" id="legal">
    <div class="box">
      <img src="/assets/assets/brand/serket-logo-primary-red-v3.png" alt="Serket" style="max-width:180px">
      <h1 data-i18n="legal_title">Uso profesional autorizado</h1>
      <p data-i18n="legal_text">Serket analiza rutas de ataque de Active Directory. Solo puedes ejecutarlo contra sistemas propios o con autorización escrita y alcance definido.</p>
      <label><input type="checkbox" id="legal-ok"> <span data-i18n="legal_check">Confirmo que dispongo de autorización escrita y asumo la responsabilidad de su uso.</span></label>
      <button class="go" id="legal-go" disabled data-i18n="legal_go">Entrar</button>
    </div>
  </div>

  <header class="top">
    <div class="brand"><img src="/assets/assets/brand/serket-icon-512.png" alt=""><span>SERKET <small data-i18n="tagline">rutas de ataque</small></span></div>
    <div class="domain" id="domain">…</div>
    <div class="search">
      <input id="q" type="search" autocomplete="off" data-i18n-ph="search_ph" placeholder="Buscar usuario, grupo, equipo…  ( / )">
      <div class="drop" id="qdrop"></div>
    </div>
    <span class="pill">LOCAL</span>
    <button class="lang" id="lang" type="button" title="Language / Idioma">EN</button>
    <a class="link" href="/classic" target="_blank" rel="noopener" data-i18n="classic">vista clásica</a>
  </header>

  <div class="main">
    <div class="stage">
      <div class="scope">
        <button id="m-neigh" type="button" data-i18n="explore">Explorar</button>
        <button id="m-path" type="button" data-i18n="route" style="display:none">Ruta</button>
        <button id="d-toggle" type="button">+1 salto</button>
      </div>
      <svg id="graph" viewBox="0 0 1280 800" preserveAspectRatio="xMidYMid meet">
        <defs>
          <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#3f4c6b"></path></marker>
          <marker id="arr-on" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#2fd9a1"></path></marker>
          <marker id="arr-in" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#56637f"></path></marker>
        </defs>
        <g id="vp"></g>
      </svg>
      <div class="legend" id="legend"></div>
      <div class="strip" id="strip">
        <div class="shead">
          <button id="sprev" type="button">←</button>
          <button id="snext" type="button">→</button>
          <strong id="stitle"></strong>
          <span class="meta" id="smeta"></span>
          <button class="x" id="sclose" type="button">×</button>
        </div>
        <div class="scroll"><svg id="spath" height="175"></svg></div>
        <div class="stepdetail" id="sdetail"></div>
      </div>
    </div>

    <aside class="side">
      <section>
        <h2><span data-i18n="my_accounts">Mis cuentas</span> <span class="count" id="owned-count"></span></h2>
        <div class="chips" id="chips"></div>
        <button class="mini" id="clear-owned" type="button" data-i18n="clear">Limpiar marcas</button>
      </section>
      <section>
        <h2 data-i18n="search">Búsqueda</h2>
        <div class="marks">
          <span>🎯 <span data-i18n="origin">Origen</span>: <b class="o" id="m-origin"></b></span>
          <span>🏁 <span data-i18n="target">Objetivo</span>: <b class="t2" id="m-target"></b></span>
        </div>
        <button class="big" id="search" type="button" data-i18n="find_paths">Buscar rutas</button>
      </section>
      <section>
        <h2><span data-i18n="paths">Rutas</span> <span class="count" id="res-count"></span></h2>
        <div class="results" id="results"></div>
      </section>
    </aside>
  </div>

  <div class="menu" id="menu"></div>
  <div class="toast" id="toast"></div>

  <script src="/assets/simple.js"></script>
</body>
</html>
