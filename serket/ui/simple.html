<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Serket — Attack Paths</title>
  <link rel="icon" href="/assets/assets/brand/favicon.ico" sizes="any">
  <script src="/assets/theme-boot.js"></script>
  <style>
    :root, [data-theme="dark"] {
      --bg0: #070a10; --bg1: #0a0e15; --panel: #0c1018; --panel2: #10151f;
      --line: #1a2230; --line2: #263149;
      --txt: #dbe2ee; --dim: #8b96ab; --faint: #5a657c;
      --accent: #27c491; --accent-dim: rgba(39,196,145,.10);
      --origin: #4a9fd8; --target: #d96a7e; --hv: #d9a62e;
      --user: #4a9fd8; --group: #d9a62e; --computer: #9a86e8; --dc: #e08a3c;
      --edge: #39445c; --edge-in: #4d5870;
      --node-fill: #0c1119;
      --lbl-outline: rgba(7,10,16,.95);
      --pill: rgba(7,10,16,.85); --pill-border: rgba(57,68,92,.55);
      --glass: rgba(10,14,21,.92); --glass2: rgba(12,16,24,.98);
      --well: rgba(7,10,16,.45); --well2: rgba(7,10,16,.65);
    }
    [data-theme="light"] {
      --bg0: #e8eaee; --bg1: #eff1f4; --panel: #f7f8fa; --panel2: #ffffff;
      --line: #c9cfd8; --line2: #b3bcc8;
      --txt: #161e2b; --dim: #4a5563; --faint: #6e7887;
      --accent: #0d7a5c; --accent-dim: rgba(13,122,92,.09);
      --origin: #1668b4; --target: #b23a52; --hv: #8a6d0d;
      --user: #1668b4; --group: #8a6d0d; --computer: #5b4bc4; --dc: #a85a08;
      --edge: #99a2ae; --edge-in: #aeb6c0;
      --node-fill: #ffffff;
      --lbl-outline: rgba(255,255,255,.95);
      --pill: rgba(255,255,255,.94); --pill-border: rgba(120,132,150,.5);
      --glass: rgba(239,241,244,.94); --glass2: rgba(247,248,250,.98);
      --well: rgba(22,30,43,.04); --well2: rgba(22,30,43,.05);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; color: var(--txt); font: 13px/1.5 var(--font, "Segoe UI", system-ui, sans-serif);
      overflow: hidden; letter-spacing: .004em;
      background: var(--bg0);
    }
    button { font: inherit; cursor: pointer; }
    ::selection { background: var(--accent-dim); }

    /* ── top bar ─────────────────────────────────────────── */
    .top {
      height: 46px; display: flex; align-items: center; gap: 14px;
      padding: 0 14px;
      background: var(--glass);
      border-bottom: 1px solid var(--line2);
    }
    .brand { display: flex; align-items: center; gap: 9px; font-weight: 800; letter-spacing: .3em; font-size: 12px; }
    .brand img { width: 22px; height: 22px; }
    .brand small { color: var(--dim); font-weight: 500; letter-spacing: .02em; text-transform: lowercase; }
    .domain { color: var(--dim); font-size: 11.5px; white-space: nowrap; font-family: Consolas, "SF Mono", monospace; }
    .domain b { color: var(--txt); font-weight: 600; }
    .search { position: relative; flex: 0 1 340px; margin-left: auto; }
    .search input {
      width: 100%; background: var(--panel2); border: 1px solid var(--line2);
      border-radius: 3px; color: var(--txt); padding: 6px 11px; outline: none;
      font-size: 12.5px; font-family: Consolas, "SF Mono", monospace;
    }
    .search input:focus { border-color: var(--accent); }
    .search input::placeholder { font-family: inherit; color: var(--faint); }
    .search .drop {
      position: absolute; top: 36px; left: 0; right: 0; background: var(--glass2);
      border: 1px solid var(--line2); max-height: 320px;
      overflow: auto; display: none; z-index: 50;
    }
    .search .drop div { padding: 6px 11px; cursor: pointer; display: flex; justify-content: space-between; gap: 10px; margin: 0; }
    .search .drop div:hover { background: var(--accent-dim); }
    .search .drop .t { color: var(--faint); font-size: 10.5px; }
    .pill {
      background: transparent; border: 1px solid var(--line2);
      color: var(--dim); font-size: 9px; font-weight: 700; letter-spacing: .18em;
      padding: 3px 8px; white-space: nowrap;
    }
    .icon-btn {
      background: transparent; border: 1px solid var(--line2); color: var(--dim);
      border-radius: 3px; padding: 4px 9px; font-size: 12px; font-weight: 700;
    }
    .icon-btn:hover { color: var(--txt); border-color: var(--faint); }
    .link { color: var(--faint); font-size: 11px; text-decoration: none; }
    .link:hover { color: var(--txt); }

    /* ── layout ──────────────────────────────────────────── */
    .main { display: flex; height: calc(100% - 46px); }
    .stage { flex: 1; position: relative; overflow: hidden; }
    .scope { position: absolute; top: 12px; left: 14px; display: flex; gap: 6px; z-index: 20; }
    .scope button {
      background: var(--glass); border: 1px solid var(--line2); color: var(--dim);
      border-radius: 3px; padding: 5px 13px; font-size: 10.5px; font-weight: 700;
      letter-spacing: .08em; text-transform: uppercase;
    }
    .scope button:hover { color: var(--txt); }
    .scope button.on { color: var(--accent); border-color: var(--accent); background: var(--accent-dim); }
    #graph { width: 100%; height: 100%; display: block; cursor: grab; }
    #graph.panning { cursor: grabbing; }

    .side {
      width: 300px; flex: none;
      background: var(--glass);
      border-left: 1px solid var(--line2);
      display: flex; flex-direction: column; overflow-y: auto; padding: 10px; gap: 10px;
    }
    .side::-webkit-scrollbar { width: 8px; }
    .side::-webkit-scrollbar-thumb { background: var(--line2); }
    .side section {
      background: var(--panel2); border: 1px solid var(--line2);
      padding: 11px;
    }
    .side h2 {
      margin: 0 0 9px; font-size: 9px; letter-spacing: .22em; text-transform: uppercase;
      color: var(--faint); display: flex; justify-content: space-between; align-items: center;
      font-weight: 700; border-bottom: 1px solid var(--line); padding-bottom: 7px;
    }
    .side h2 .count { color: var(--accent); letter-spacing: 0; font-size: 11px; }

    /* ── node info panel ─────────────────────────────────── */
    .ni-head { display: flex; align-items: center; gap: 10px; margin-bottom: 9px; }
    .ni-ico {
      width: 32px; height: 32px; flex: none;
      display: flex; align-items: center; justify-content: center;
      background: var(--node-fill); border: 1px solid var(--nc, var(--dim));
      color: var(--nc, var(--dim));
    }
    .ni-ico svg { width: 18px; height: 18px; }
    .ni-head b { font-size: 12.5px; font-family: Consolas, "SF Mono", monospace; font-weight: 600; word-break: break-all; }
    .ni-head small { display: block; color: var(--faint); font-size: 9.5px; letter-spacing: .12em; text-transform: uppercase; }
    .ni-flags { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 9px; }
    .ni-flags span {
      font-size: 9px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
      padding: 2px 6px; background: var(--accent-dim); color: var(--accent);
      border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent);
    }
    .ni-flags span.warn { background: color-mix(in srgb, var(--hv) 12%, transparent); color: var(--hv); border-color: color-mix(in srgb, var(--hv) 45%, transparent); }
    .ni-flags span.bad { background: color-mix(in srgb, var(--target) 10%, transparent); color: var(--target); border-color: color-mix(in srgb, var(--target) 45%, transparent); }
    .ni-stats { display: flex; gap: 5px; margin-bottom: 9px; }
    .ni-stats div {
      flex: 1; text-align: center; background: var(--well2); border: 1px solid var(--line);
      padding: 6px 3px;
    }
    .ni-stats b { display: block; font-size: 15px; color: var(--accent); font-family: Consolas, "SF Mono", monospace; }
    .ni-stats span { font-size: 8.5px; color: var(--faint); letter-spacing: .08em; text-transform: uppercase; }
    .ni-row { display: flex; justify-content: space-between; gap: 10px; padding: 3px 0; border-bottom: 1px solid var(--line); font-size: 11.5px; }
    .ni-row:last-child { border-bottom: 0; }
    .ni-row span { color: var(--dim); flex: none; }
    .ni-row b { font-weight: 500; font-family: Consolas, "SF Mono", monospace; font-size: 10.5px; text-align: right; word-break: break-all; }
    .ni-hint { color: var(--faint); font-size: 10px; margin-top: 8px; }

    .chips { display: flex; flex-wrap: wrap; gap: 5px; }
    .chip {
      display: inline-flex; align-items: center; gap: 6px; max-width: 100%;
      background: var(--well); border: 1px solid var(--line2);
      color: var(--txt); padding: 2px 4px 2px 8px; font-size: 11px;
      font-family: Consolas, "SF Mono", monospace;
    }
    .chip:hover { border-color: var(--faint); }
    .chip i { font-style: normal; max-width: 165px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
    .chip b { cursor: pointer; padding: 0 5px; font-weight: 400; color: var(--faint); }
    .chip b:hover { color: var(--target); }
    .empty { color: var(--faint); font-size: 11px; font-style: italic; }

    .marks { display: flex; flex-direction: column; gap: 6px; font-size: 12px; margin-bottom: 10px; }
    .marks span { color: var(--dim); display: flex; gap: 7px; align-items: center; }
    .marks b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 180px; display: inline-block; vertical-align: bottom; font-family: Consolas, "SF Mono", monospace; font-size: 11px; }
    .marks .o { color: var(--origin); } .marks .t2 { color: var(--target); }

    .big {
      width: 100%; background: var(--accent); color: #ffffff;
      border: 1px solid color-mix(in srgb, var(--accent) 70%, black);
      font-weight: 700; border-radius: 3px; padding: 9px; font-size: 11.5px;
      letter-spacing: .1em; text-transform: uppercase;
    }
    .big:not(:disabled):hover { filter: brightness(1.08); }
    .big:not(:disabled):active { transform: translateY(1px); }
    .big:disabled { opacity: .35; cursor: not-allowed; }
    .mini {
      width: 100%; background: transparent; color: var(--dim); border: 1px solid var(--line2);
      border-radius: 3px; padding: 6px; font-size: 10.5px; margin-top: 8px;
      letter-spacing: .06em; text-transform: uppercase; font-weight: 600;
    }
    .mini:hover { color: var(--txt); border-color: var(--faint); }

    .results { display: flex; flex-direction: column; gap: 5px; }
    .result {
      text-align: left; background: var(--well); border: 1px solid var(--line2);
      padding: 7px 10px; color: var(--txt); width: 100%;
    }
    .result:hover { border-color: var(--faint); }
    .result.active { border-color: var(--accent); background: var(--accent-dim); }
    .result .r1 { display: flex; justify-content: space-between; gap: 8px; font-weight: 600; font-size: 11.5px; font-family: Consolas, "SF Mono", monospace; }
    .result .r2 { color: var(--dim); font-size: 10.5px; margin-top: 3px; }
    .n { display: inline-block; width: 7px; height: 7px; margin-right: 5px; }
    .n.low { background: var(--accent); } .n.med { background: var(--hv); } .n.high { background: var(--target); }

    /* ── graph ───────────────────────────────────────────── */
    .legend {
      position: absolute; left: 14px; bottom: 14px; display: flex; gap: 13px;
      background: var(--glass); border: 1px solid var(--line2);
      padding: 6px 12px; font-size: 10.5px; color: var(--dim);
    }
    .legend i { display: inline-block; width: 8px; height: 8px; margin-right: 5px; }
    .legend i.li-line { width: 15px; height: 0; border-top: 2px solid var(--edge); vertical-align: middle; }
    .legend i.li-line.dash { border-top-style: dashed; border-top-color: var(--edge-in); }

    .gnode { cursor: pointer; }
    .gnode .halo { fill: none; stroke: transparent; }
    .gnode .glow { fill: none; stroke-opacity: 0; stroke-width: 5; transition: stroke-opacity .12s; pointer-events: none; }
    .gnode:hover .glow { stroke-opacity: .25; }
    .gnode .body {
      fill: var(--node-fill); stroke-width: 1.5;
      transition: stroke-width .1s;
    }
    .gnode.t-user .body { fill: color-mix(in srgb, var(--user) 9%, var(--node-fill)); }
    .gnode.t-group .body { fill: color-mix(in srgb, var(--group) 9%, var(--node-fill)); }
    .gnode.t-computer .body { fill: color-mix(in srgb, var(--computer) 8%, var(--node-fill)); }
    .gnode.t-dc .body { fill: color-mix(in srgb, var(--dc) 9%, var(--node-fill)); }
    .gnode.t-cert .body { fill: color-mix(in srgb, #1f9e8e 8%, var(--node-fill)); }
    .gnode.t-obj .body { fill: color-mix(in srgb, var(--faint) 8%, var(--node-fill)); }
    .gnode:hover .body { stroke-width: 2.2; }
    .gnode .sym { pointer-events: none; opacity: .95; }
    .gnode .lbl {
      font-size: 11px; font-weight: 600; fill: var(--txt); text-anchor: middle;
      paint-order: stroke; stroke: var(--lbl-outline); stroke-width: 4px; stroke-linejoin: round;
      pointer-events: none;
    }
    .gnode.owned .body { stroke: var(--accent) !important; }
    .gnode.owned .halo { stroke: color-mix(in srgb, var(--accent) 55%, transparent); stroke-width: 1.5; }
    .gnode.origin .halo { stroke: var(--origin); stroke-width: 1.5; stroke-dasharray: 4 3; }
    .gnode.target .halo { stroke: var(--target); stroke-width: 1.5; stroke-dasharray: 4 3; }
    .gnode .own { fill: var(--accent); stroke: var(--bg0); stroke-width: 1.4; }
    .edge-lbl { font-family: inherit; }

    /* ── path strip ──────────────────────────────────────── */
    .strip {
      position: absolute; left: 0; right: 0; bottom: 0; max-height: 47%;
      background: var(--glass2);
      border-top: 1px solid var(--line2);
      display: none; flex-direction: column; padding: 10px 14px 12px;
    }
    .strip.open { display: flex; }
    .strip .shead { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
    .strip .shead strong { font-size: 12.5px; font-family: Consolas, "SF Mono", monospace; font-weight: 600; }
    .strip .shead .meta { color: var(--dim); font-size: 11px; }
    .strip .shead button {
      background: var(--panel2); border: 1px solid var(--line2); color: var(--txt);
      border-radius: 3px; padding: 3px 11px; font-size: 12px;
    }
    .strip .shead button:hover { border-color: var(--faint); }
    .strip .shead .x { margin-left: auto; background: transparent; border: 0; color: var(--dim); font-size: 17px; padding: 2px 8px; }
    .strip .shead .x:hover { color: var(--txt); }
    .strip .scroll { overflow-x: auto; overflow-y: hidden; }
    .strip svg { display: block; }
    .stepdetail { color: var(--dim); font-size: 11.5px; min-height: 17px; margin-top: 4px; font-family: Consolas, "SF Mono", monospace; }
    .stepdetail b { color: var(--txt); }
    .snode circle.body2 { fill: var(--node-fill); }
    .snode.t-user .body2 { fill: color-mix(in srgb, var(--user) 9%, var(--node-fill)); }
    .snode.t-group .body2 { fill: color-mix(in srgb, var(--group) 9%, var(--node-fill)); }
    .snode.t-computer .body2 { fill: color-mix(in srgb, var(--computer) 8%, var(--node-fill)); }
    .snode.t-dc .body2 { fill: color-mix(in srgb, var(--dc) 9%, var(--node-fill)); }
    .snode.t-cert .body2 { fill: color-mix(in srgb, #1f9e8e 8%, var(--node-fill)); }
    .snode.t-obj .body2 { fill: color-mix(in srgb, var(--faint) 8%, var(--node-fill)); }
    .snode text { paint-order: stroke; stroke: var(--lbl-outline); stroke-width: 3.5px; stroke-linejoin: round; }
    .snode .nm { fill: var(--txt); }

    /* ── context menu ────────────────────────────────────── */
    .menu {
      position: fixed; z-index: 100; min-width: 230px; display: none;
      background: var(--glass2); border: 1px solid var(--line2);
      padding: 4px;
    }
    .menu.open { display: block; }
    .menu .mh { padding: 7px 10px 6px; border-bottom: 1px solid var(--line); margin-bottom: 3px; }
    .menu .mh b { display: block; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 280px; font-family: Consolas, "SF Mono", monospace; font-weight: 600; }
    .menu .mh span { font-size: 9px; letter-spacing: .18em; text-transform: uppercase; color: var(--faint); }
    .menu button {
      display: flex; gap: 9px; width: 100%; text-align: left; background: transparent;
      border: 0; color: var(--txt); padding: 7px 10px; font-size: 12px;
    }
    .menu button:hover { background: var(--accent-dim); }

    .toast {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: var(--glass2); border: 1px solid var(--line2); color: var(--txt);
      padding: 8px 16px; font-size: 12px; display: none; z-index: 200;
      font-family: Consolas, "SF Mono", monospace;
    }

    /* ── legal modal ─────────────────────────────────────── */
    .modal {
      position: fixed; inset: 0; background: rgba(3,5,9,.9); display: flex;
      align-items: center; justify-content: center; z-index: 500;
    }
    .modal[hidden] { display: none; }
    .modal .box {
      width: 460px; background: var(--panel2);
      border: 1px solid var(--line2); padding: 28px; text-align: center;
    }
    .modal h1 { font-size: 17px; margin: 12px 0 7px; font-weight: 700; letter-spacing: .02em; }
    .modal p { color: var(--dim); font-size: 12.5px; margin: 0 0 18px; line-height: 1.6; }
    .modal label { display: flex; gap: 10px; text-align: left; font-size: 12px; color: var(--txt); margin-bottom: 16px; line-height: 1.5; }
    .modal .go {
      width: 100%; background: var(--accent); border: 1px solid color-mix(in srgb, var(--accent) 70%, black);
      color: #ffffff; font-weight: 700; border-radius: 3px; padding: 11px; font-size: 12px;
      letter-spacing: .08em; text-transform: uppercase;
    }
    .modal .go:disabled { opacity: .35; cursor: not-allowed; }
  </style>
</head>
<body>

  <div class="modal" id="legal">
    <div class="box">
      <img src="/assets/assets/brand/serket-logo-primary-red-v3.png" alt="Serket" style="max-width:180px">
      <h1 data-i18n="legal_title">Uso profesional autorizado</h1>
      <p data-i18n="legal_text">Serket analiza rutas de ataque de Active Directory. Solo puedes ejecutarlo contra sistemas propios o con autorización escrita y alcance definido.</p>
      <label><input type="checkbox" id="legal-ok"> <span data-i18n="legal_check">Confirmo que dispongo de autorización escrita y asumo la responsabilidad de su uso.</span></label>
      <button class="go" id="legal-go" disabled data-i18n="legal_go">Entrar</button>
    </div>
  </div>

  <header class="top">
    <div class="brand"><img src="/assets/assets/brand/serket-icon-512.png" alt=""><span>SERKET <small data-i18n="tagline">rutas de ataque</small></span></div>
    <div class="domain" id="domain">…</div>
    <div class="search">
      <input id="q" type="search" autocomplete="off" data-i18n-ph="search_ph" placeholder="Buscar usuario, grupo, equipo…  ( / )">
      <div class="drop" id="qdrop"></div>
    </div>
    <span class="pill">LOCAL</span>
    <button class="icon-btn" id="theme" type="button" title="Tema / Theme">🌙</button>
    <button class="icon-btn" id="lang" type="button" title="Language / Idioma">EN</button>
    <a class="link" href="/classic" target="_blank" rel="noopener" data-i18n="classic">vista clásica</a>
  </header>

  <div class="main">
    <div class="stage">
      <div class="scope">
        <button id="m-neigh" type="button" data-i18n="explore">Explorar</button>
        <button id="m-path" type="button" data-i18n="route" style="display:none">Ruta</button>
        <button id="d-toggle" type="button">+1 salto</button>
      </div>
      <svg id="graph" viewBox="0 0 1280 800" preserveAspectRatio="xMidYMid meet">
        <defs>
          <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#99a2ae"></path></marker>
          <marker id="arr-on" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#0d7a5c"></path></marker>
          <marker id="arr-in" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#aeb6c0"></path></marker>
        </defs>
        <g id="vp"></g>
      </svg>
      <div class="legend" id="legend"></div>
      <div class="strip" id="strip">
        <div class="shead">
          <button id="sprev" type="button">←</button>
          <button id="snext" type="button">→</button>
          <strong id="stitle"></strong>
          <span class="meta" id="smeta"></span>
          <button class="x" id="sclose" type="button">×</button>
        </div>
        <div class="scroll"><svg id="spath" height="175"></svg></div>
        <div class="stepdetail" id="sdetail"></div>
      </div>
    </div>

    <aside class="side">
      <section>
        <h2 data-i18n="node_info">Nodo</h2>
        <div id="ninfo"></div>
      </section>
      <section>
        <h2><span data-i18n="my_accounts">Mis cuentas</span> <span class="count" id="owned-count"></span></h2>
        <div class="chips" id="chips"></div>
        <button class="mini" id="clear-owned" type="button" data-i18n="clear">Limpiar marcas</button>
      </section>
      <section>
        <h2 data-i18n="search">Búsqueda</h2>
        <div class="marks">
          <span>🎯 <span data-i18n="origin">Origen</span>: <b class="o" id="m-origin"></b></span>
          <span>🏁 <span data-i18n="target">Objetivo</span>: <b class="t2" id="m-target"></b></span>
        </div>
        <button class="big" id="search" type="button" data-i18n="find_paths">Buscar rutas</button>
      </section>
